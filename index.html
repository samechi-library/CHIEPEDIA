<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まめちしき辞典 - ChiePedia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">💡</span>
        <div>
          <h1>まめちしき辞典</h1>
          <p class="subtitle">ChiePedia</p>
        </div>
      </div>
      <button id="btn-reload" class="reload-btn" title="最新データに更新">↻ 更新</button>
    </div>

    <div class="search-area">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="豆知識名・#タグで検索..." autocomplete="off">
        <button id="btn-clear-search" class="clear-btn" hidden>✕</button>
      </div>
      <div id="tag-filter-bar" class="tag-filter-bar"></div>
    </div>
  </header>

  <main class="container">
    <div class="status-bar">
      <span id="result-count">読み込み中...</span>
    </div>

    <div id="trivia-grid" class="trivia-grid"></div>
  </main>

  <!-- 画面いっぱい画像表示モーダル -->
  <div id="image-modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-toolbar">
      <span id="modal-caption" class="modal-caption"></span>
      <div class="modal-actions">
        <button id="btn-toggle-zoom" class="modal-btn">🔍 拡大切替</button>
        <button id="btn-close-modal" class="modal-btn close">✕ 閉じる</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body">
      <img id="modal-image" src="" alt="拡大画像">
    </div>
  </div>

  <!-- 読込順に注意：contents.js → system.js -->
  <script src="contents.js"></script>
  <script src="system.js"></script>
</body>
</html>
