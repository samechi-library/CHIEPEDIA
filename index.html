<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>まめちしき辞典 - ChiePedia</title>
  <!-- Google Fonts: 読みやすい日本語明朝・ゴシックの組み合わせ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- =========================================================
       [style.css 相当] アプリ全体のカスタムスタイル定義
       ========================================================= -->
  <style id="app-style-css">
    :root {
      --bg-paper: #FAF8F5;
      --bg-card: #FFFFFF;
      --text-ink: #1E293B;
      --text-muted: #64748B;
      --accent-amber: #D97706;
      --accent-amber-light: #FEF3C7;
      --accent-amber-dark: #B45309;
      --border-subtle: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    .font-serif-title {
      font-family: 'Shippori Mincho', 'Noto Sans JP', serif;
    }

    /* ヘッダーのすりガラス効果 */
    .glass-header {
      background: rgba(250, 248, 245, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
    }

    /* タグバーの横スクロール（スクロールバー非表示） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 豆知識カードのホバー・タップアニメーション */
    .trivia-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 1.25rem;
      box-shadow: 0 4px 20px -2px rgba(30, 41, 59, 0.05);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.22s ease;
    }

    @media (hover: hover) {
      .trivia-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px -6px rgba(30, 41, 59, 0.1);
        border-color: #CBD5E1;
      }
    }

    /* 添付画像サムネイル枠 */
    .trivia-image-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 0.875rem;
      border: 1px solid #E2E8F0;
      background: #F8FAFC;
      cursor: zoom-in;
    }

    .trivia-image-wrapper img,
    .trivia-image-wrapper svg {
      transition: transform 0.35s ease;
    }

    @media (hover: hover) {
      .trivia-image-wrapper:hover img,
      .trivia-image-wrapper:hover svg {
        transform: scale(1.03);
      }
    }

    /* フルスクリーン画像モーダル */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .fullscreen-modal.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-image-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 1rem 5.5rem 1rem;
      overflow: auto;
    }

    .modal-image-stage img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center center;
    }

    .modal-image-stage img.is-zoomed {
      transform: scale(1.65);
      cursor: zoom-out;
    }

    /* 4ファイル構成コード表示モーダル */
    .code-modal {
      position: fixed;
      inset: 0;
      z-index: 110;
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .code-modal.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* iPad 11インチ (834px〜1194px) 向けの最適化調整 */
    @media (min-width: 768px) and (max-width: 1280px) {
      .ipad-container {
        max-width: 1040px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-200 selection:text-slate-900">

  <!-- =========================================================
       ヘッダー＆検索エリア（スマートフォン・iPad 11インチ両対応）
       ========================================================= -->
  <header class="glass-header sticky top-0 z-40">
    <div class="max-w-5xl ipad-container mx-auto px-4 sm:px-6 pt-3.5 pb-3">
      <!-- トップバー：アプリタイトル ＆ 4ファイル出力ボタン -->
      <div class="flex items-center justify-between gap-3 mb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 text-white flex items-center justify-center shadow-sm shrink-0">
            <!-- 本・電球アイコン SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-serif-title text-xl sm:text-2xl font-bold tracking-tight text-slate-900">
                まめちしき辞典
              </h1>
              <span class="hidden sm:inline-block text-xs font-semibold tracking-wider uppercase px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">
                ChiePedia
              </span>
            </div>
            <p class="text-xs text-slate-500">日常がちょっと楽しくなる雑学アーカイブ</p>
          </div>
        </div>

        <!-- 4ファイル構成ソースコード表示ボタン -->
        <button
          id="openCodeModalBtn"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 active:scale-95 transition shadow-xs shrink-0"
          title="index.html / style.css / system.js / contents.js の4ファイルを表示"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
          <span>4ファイル構成</span>
        </button>
      </div>

      <!-- 検索入力フォーム（豆知識名・タグ名の両方で検索可能） -->
      <div class="relative flex items-center">
        <span class="absolute left-3.5 text-slate-400 pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z" />
          </svg>
        </span>
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          placeholder="豆知識名やタグ名で検索（例：フラミンゴ、宇宙、食べ物…）"
          aria-label="豆知識名やタグ名で検索"
          class="w-full pl-11 pr-11 py-3 rounded-2xl bg-white border border-slate-200 text-sm sm:text-base text-slate-800 placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition shadow-xs"
        />
        <button
          id="clearSearchBtn"
          type="button"
          aria-label="検索条件をクリア"
          class="hidden absolute right-2.5 p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- タグフィルターピル一覧 -->
      <div class="mt-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5" id="tagFilterContainer" role="tablist" aria-label="タグで絞り込み">
        <!-- JS (system.js) により動的にタグボタンを生成 -->
      </div>
    </div>
  </header>

  <!-- =========================================================
       メインコンテンツ：検索ステータス ＆ 豆知識カード一覧
       ========================================================= -->
  <main class="flex-1 max-w-5xl ipad-container w-full mx-auto px-4 sm:px-6 py-5 sm:py-7">
    <!-- 件数表示 ＆ フィルタ状態バー -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4 sm:mb-5">
      <p id="resultCountText" class="text-xs sm:text-sm font-medium text-slate-600">
        全 0 件の豆知識を表示中
      </p>
      <div class="flex items-center gap-2">
        <label class="inline-flex items-center gap-1.5 text-xs sm:text-sm text-slate-600 cursor-pointer select-none bg-white px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition">
          <input id="onlyWithImageCheckbox" type="checkbox" class="rounded text-amber-600 focus:ring-amber-500 w-4 h-4" />
          <span>画像付きのみ表示</span>
        </label>
      </div>
    </div>

    <!-- 豆知識カードグリッド（スマホ：1列 / iPad 11インチ以上：2列） -->
    <section
      id="triviaGrid"
      class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-start"
      aria-live="polite"
    >
      <!-- JS (system.js) により豆知識カードを生成 -->
    </section>

    <!-- 検索結果0件時のエンプティステート -->
    <div id="emptyState" class="hidden text-center py-16 px-4 bg-white rounded-3xl border border-slate-200/80 shadow-xs">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="text-base sm:text-lg font-bold text-slate-800 mb-1">一致する豆知識が見つかりませんでした</h2>
      <p class="text-xs sm:text-sm text-slate-500 mb-5">
        別のキーワードやタグ名で検索するか、フィルターをリセットしてみてください。
      </p>
      <button
        id="resetAllFiltersBtn"
        type="button"
        class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium transition shadow-xs"
      >
        すべての豆知識を表示する
      </button>
    </div>
  </main>

  <!-- =========================================================
       フッター
       ========================================================= -->
  <footer class="border-t border-slate-200/80 bg-white/60 py-5 px-4 text-center text-xs text-slate-500">
    <p>まめちしき辞典 - ChiePedia ｜ スマホ・iPad 11インチ対応</p>
  </footer>

  <!-- =========================================================
       フルスクリーン画像モーダル（画面いっぱいに画像を表示）
       ========================================================= -->
  <div
    id="imageModal"
    class="fullscreen-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalImageTitle"
  >
    <!-- モーダル上部コントロールバー -->
    <div class="fixed top-0 inset-x-0 z-20 flex items-center justify-between px-4 sm:px-6 py-3.5 bg-gradient-to-b from-slate-950/90 to-transparent text-white">
      <div class="min-w-0 pr-3">
        <span class="inline-block text-[11px] font-semibold tracking-wider uppercase text-amber-400">図解・拡大ビュー</span>
        <h3 id="modalImageTitle" class="text-sm sm:text-base font-bold truncate">画像タイトル</h3>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button
          id="toggleZoomBtn"
          type="button"
          class="px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-xs sm:text-sm font-medium text-white backdrop-blur-xs transition"
        >
          🔍 拡大切替
        </button>
        <button
          id="closeImageModalBtn"
          type="button"
          aria-label="モーダルを閉じる"
          class="w-10 h-10 rounded-xl bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- モーダル中央：画面いっぱいの画像表示領域 -->
    <div id="modalBackdrop" class="modal-image-stage">
      <img id="modalFullImage" src="" alt="拡大画像" />
    </div>

    <!-- モーダル下部キャプション -->
    <div class="fixed bottom-0 inset-x-0 z-20 px-4 sm:px-6 py-3.5 bg-gradient-to-t from-slate-950/90 to-transparent text-center text-xs sm:text-sm text-slate-200 pointer-events-none">
      <p id="modalImageCaption">画像をタップで拡大・縮小 / 背景または「×」で閉じる</p>
    </div>
  </div>

  <!-- =========================================================
       [contents.js 相当] 豆知識データ定義ファイル
       ※ 外部画像リンク切れを防ぐため、高精細なインラインSVGデータURIを使用
       ========================================================= -->
  <script id="app-contents-js">
    /**
     * SVG文字列を安全なData URIに変換するヘルパー関数
     */
    function createSvgDataUri(svgContent) {
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgContent.trim());
    }

    /**
     * 豆知識データベース（contents.js）
     * id: 一意のID
     * title: 豆知識名
     * tags: 検索・絞り込み用タグ配列
     * content: 豆知識の解説本文
     * image: 添付画像URL（nullの場合はテキストのみの豆知識）
     * imageCaption: モーダル拡大表示時の解説キャプション
     */
    const TRIVIA_CONTENTS = [
      {
        id: 1,
        title: "フラミンゴの羽がピンク色なのは食べ物のせい",
        tags: ["動物", "生き物", "雑学"],
        content: "フラミンゴは生まれたときは白色や灰色の羽をしています。主食である藍藻類（スピルリナなど）や甲殻類に含まれる赤色色素「カンタキサンチン」を体内で分解・吸収することで、羽が鮮やかなピンク色へと変化します。動物園では色を保つために色素を含む専用エサを与えています。",
        image: createSvgDataUri(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
            <defs>
              <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FFF1F2"/>
                <stop offset="100%" stop-color="#FFE4E6"/>
              </linearGradient>
            </defs>
            <rect width="800" height="460" fill="url(#bg1)"/>
            <text x="400" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#881337" text-anchor="middle">フラミンゴがピンク色になる仕組み</text>
            <!-- ステップ1：ヒナ -->
            <rect x="45" y="85" width="210" height="310" rx="20" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
            <circle cx="150" cy="195" r="52" fill="#E2E8F0"/>
            <circle cx="165" cy="180" r="6" fill="#1E293B"/>
            <path d="M195 190 Q220 195 205 210 Z" fill="#64748B"/>
            <text x="150" y="295" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155" text-anchor="middle">① ヒナの頃</text>
            <text x="150" y="325" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">生まれたての羽は</text>
            <text x="150" y="346" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">「白〜灰色」</text>
            <!-- 矢印1 -->
            <path d="M268 235 L292 235" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
            <polygon points="290,225 306,235 290,245" fill="#F43F5E"/>
            <!-- ステップ2：食事 -->
            <rect x="310" y="85" width="210" height="310" rx="20" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
            <circle cx="415" cy="195" r="52" fill="#FFEDD5"/>
            <path d="M390 205 C390 175, 440 175, 435 205 C430 220, 405 220, 405 205" fill="none" stroke="#EA580C" stroke-width="8" stroke-linecap="round"/>
            <circle cx="430" cy="190" r="4" fill="#1E293B"/>
            <text x="415" y="295" font-family="sans-serif" font-size="18" font-weight="bold" fill="#9A3412" text-anchor="middle">② 色素を摂取</text>
            <text x="415" y="325" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">藻類や甲殻類の</text>
            <text x="415" y="346" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">「カンタキサンチン」</text>
            <!-- 矢印2 -->
            <path d="M533 235 L557 235" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
            <polygon points="555,225 571,235 555,245" fill="#F43F5E"/>
            <!-- ステップ3：成鳥 -->
            <rect x="575" y="85" width="180" height="310" rx="20" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="3"/>
            <circle cx="665" cy="195" r="52" fill="#FB7185"/>
            <circle cx="680" cy="180" r="6" fill="#1E293B"/>
            <path d="M710 190 Q735 195 720 212 Z" fill="#1E293B"/>
            <text x="665" y="295" font-family="sans-serif" font-size="18" font-weight="bold" fill="#BE123C" text-anchor="middle">③ 成鳥の羽</text>
            <text x="665" y="325" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">肝臓で分解され</text>
            <text x="665" y="346" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E11D48" text-anchor="middle">鮮やかなピンクへ！</text>
          </svg>
        `),
        imageCaption: "フラミンゴのヒナ（灰色）が藻類や甲殻類の色素を摂取してピンク色の成鳥になるプロセス図解"
      },
      {
        id: 2,
        title: "エッフェル塔は夏になると約15cm背が高くなる",
        tags: ["科学", "建築", "世界"],
        content: "フランスの象徴であるエッフェル塔は錬鉄（鉄）で造られています。金属には温度が上がると体積が膨張する「熱膨張」という性質があるため、真夏に太陽の熱で鉄骨が温められると、塔全体の高さが冬場よりも最大で約15センチメートル伸びます。",
        image: createSvgDataUri(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
            <rect width="800" height="460" fill="#EFF6FF"/>
            <text x="400" y="46" font-family="sans-serif" font-size="23" font-weight="bold" fill="#1E3A8A" text-anchor="middle">金属の「熱膨張」によるエッフェル塔の高さ変化</text>
            <!-- 冬の塔 -->
            <rect x="70" y="75" width="300" height="340" rx="20" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
            <text x="220" y="112" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">❄️ 冬（低温時）</text>
            <polygon points="220,155 180,350 260,350" fill="none" stroke="#3B82F6" stroke-width="6"/>
            <line x1="192" y1="280" x2="248" y2="280" stroke="#3B82F6" stroke-width="5"/>
            <line x1="204" y1="220" x2="236" y2="220" stroke="#3B82F6" stroke-width="5"/>

  <!-- =========================================================
       [system.js 相当] アプリ全体の動作制御・検索・モーダル制御
       ========================================================= -->
  <script id="app-system-js">
    document.addEventListener("DOMContentLoaded", () => {
      // アプリの状態管理
      const state = {
        searchQuery: "",
        selectedTag: "すべて",
        onlyWithImage: false,
        isImageZoomed: false,
        activeCodeTab: "index.html"
      };

      // DOM要素の取得
      const searchInput = document.getElementById("searchInput");
      const clearSearchBtn = document.getElementById("clearSearchBtn");
      const tagFilterContainer = document.getElementById("tagFilterContainer");
      const onlyWithImageCheckbox = document.getElementById("onlyWithImageCheckbox");
      const resultCountText = document.getElementById("resultCountText");
      const triviaGrid = document.getElementById("triviaGrid");
      const emptyState = document.getElementById("emptyState");
      const resetAllFiltersBtn = document.getElementById("resetAllFiltersBtn");

      // 画像フルスクリーンモーダル要素
      const imageModal = document.getElementById("imageModal");
      const modalBackdrop = document.getElementById("modalBackdrop");
      const modalFullImage = document.getElementById("modalFullImage");
      const modalImageTitle = document.getElementById("modalImageTitle");
      const modalImageCaption = document.getElementById("modalImageCaption");
      const closeImageModalBtn = document.getElementById("closeImageModalBtn");
      const toggleZoomBtn = document.getElementById("toggleZoomBtn");

      // 4ファイル構成モーダル要素
      const openCodeModalBtn = document.getElementById("openCodeModalBtn");
      const codeExportModal = document.getElementById("codeExportModal");
      const closeCodeModalBtn = document.getElementById("closeCodeModalBtn");
      const codeFileTabs = document.getElementById("codeFileTabs");
      const codeViewerPre = document.getElementById("codeViewerPre");
      const copyCodeBtn = document.getElementById("copyCodeBtn");

      /**
       * カタカナをひらがなへ正規化・小文字化して検索しやすくする
       */
      function normalizeText(str) {
        if (!str) return "";
        return str
          .toLowerCase()
          .trim()
          .replace(/[\u30a1-\u30f6]/g, (match) =>
            String.fromCharCode(match.charCodeAt(0) - 0x60)
          );
      }

      /**
       * 全データから重複なしのタグ一覧を抽出し、タグボタンを描画
       */
      function renderTagPills() {
        const tagCounts = new Map();
        TRIVIA_CONTENTS.forEach((item) => {
          item.tags.forEach((tag) => {
            tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1);
          });
        });

        const allTags = ["すべて", ...Array.from(tagCounts.keys())];
        tagFilterContainer.innerHTML = "";

        allTags.forEach((tag) => {
          const isSelected = state.selectedTag === tag;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", String(isSelected));
          btn.className = isSelected
            ? "shrink-0 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-amber-600 text-white shadow-xs transition"
            : "shrink-0 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-amber-50 hover:text-amber-800 hover:border-amber-200 transition";

          const count = tag === "すべて" ? TRIVIA_CONTENTS.length : tagCounts.get(tag);
          btn.textContent = tag === "すべて" ? `すべて (${count})` : `#${tag} (${count})`;

          btn.addEventListener("click", () => {
            state.selectedTag = tag;
            renderTagPills();
            renderTriviaList();
          });

          tagFilterContainer.appendChild(btn);
        });
      }

      /**
       * 検索条件・選択タグ・画像有無フィルターに基づいて豆知識一覧を抽出・描画
       */
      function renderTriviaList() {
        const rawQuery = state.searchQuery.trim();
        // 先頭の「#」を取り除いて検索できるように対応
        const cleanQuery = normalizeText(rawQuery.replace(/^[#＃]+/, ""));

        const filtered = TRIVIA_CONTENTS.filter((item) => {
          // 1. タグピル絞り込み
          if (state.selectedTag !== "すべて" && !item.tags.includes(state.selectedTag)) {
            return false;
          }

          // 2. 画像付きのみフィルター
          if (state.onlyWithImage && !item.image) {
            return false;
          }

          // 3. キーワード検索（豆知識名に含む OR 付随タグ名に含む）
          if (cleanQuery.length > 0) {
            const normTitle = normalizeText(item.title);
            const titleMatch = normTitle.includes(cleanQuery);
            const tagMatch = item.tags.some((t) => normalizeText(t).includes(cleanQuery));
            return titleMatch || tagMatch;
          }

          return true;
        });

        // 件数表示の更新
        resultCountText.textContent =
          filtered.length === TRIVIA_CONTENTS.length
            ? `全 ${filtered.length} 件の豆知識を表示中`
            : `該当 ${filtered.length} 件 / 全 ${TRIVIA_CONTENTS.length} 件`;

        // クリアボタンの表示切り替え
        if (rawQuery.length > 0) {
          clearSearchBtn.classList.remove("hidden");
        } else {
          clearSearchBtn.classList.add("hidden");
        }

        // 0件表示の制御
        if (filtered.length === 0) {
          triviaGrid.innerHTML = "";
          emptyState.classList.remove("hidden");
          return;
        }
        emptyState.classList.add("hidden");

        // カードDOMの構築
        triviaGrid.innerHTML = "";
        filtered.forEach((item) => {
          const card = document.createElement("article");
          card.className = "trivia-card p-5 sm:p-6 flex flex-col justify-between";

          // タグHTMLの生成（タグクリックでも検索絞り込み可能）
          const tagsHtml = item.tags
            .map(
              (tag) => `
              <button
                type="button"
                data-tag-click="${escapeHtml(tag)}"
                class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200/70 hover:bg-amber-100 transition"
              >
                #${escapeHtml(tag)}
              </button>`
            )
            .join("");

          // 画像セクションHTML（画像がある豆知識のみ表示）
          const imageSectionHtml = item.image
            ? `
              <div class="mt-4">
                <div
                  class="trivia-image-wrapper group"
                  role="button"
                  tabindex="0"
                  aria-label="${escapeHtml(item.title)}の画像を全画面で拡大表示"
                  data-open-modal-id="${item.id}"
                >
                  <img
                    src="${item.image}"
                    alt="${escapeHtml(item.title)}"
                    loading="lazy"
                    class="w-full h-48 sm:h-52 object-cover block"
                  />
                  <div class="absolute bottom-2.5 right-2.5 px-3 py-1.5 rounded-xl bg-slate-900/75 text-white text-xs font-medium backdrop-blur-xs flex items-center gap-1.5 shadow-sm group-hover:bg-amber-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                    </svg>
                    <span>画面いっぱいに拡大</span>
                  </div>
                </div>
              </div>
            `
            : "";

          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <span class="text-xs font-bold tracking-wider text-amber-700 bg-amber-100/80 px-2.5 py-0.5 rounded-md">
                  No.${String(item.id).padStart(2, "0")}
                </span>
                ${
                  item.image
                    ? '<span class="text-[11px] font-medium text-slate-500 flex items-center gap-1">🖼️ 図解あり</span>'
                    : '<span class="text-[11px] font-medium text-slate-400">📖 読み物</span>'
                }
              </div>

              <h2 class="font-serif-title text-lg sm:text-xl font-bold text-slate-900 leading-snug mb-3">
                ${escapeHtml(item.title)}
              </h2>

              <p class="text-sm sm:text-[15px] text-slate-700 leading-relaxed">
                ${escapeHtml(item.content)}
              </p>

              ${imageSectionHtml}
            </div>

            <div class="mt-4 pt-3.5 border-t border-slate-100 flex flex-wrap gap-1.5">
              ${tagsHtml}
            </div>
          `;

          // カード内タグボタンのクリックイベント
          card.querySelectorAll("[data-tag-click]").forEach((tagBtn) => {
            tagBtn.addEventListener("click", () => {
              const clickedTag = tagBtn.getAttribute("data-tag-click");
              state.selectedTag = clickedTag;
              renderTagPills();
              renderTriviaList();
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
          });

          // カード内画像クリックでフルスクリーンモーダルを開く
          const imgTrigger = card.querySelector("[data-open-modal-id]");
          if (imgTrigger) {
            const openHandler = () => openFullscreenImageModal(item);
            imgTrigger.addEventListener("click", openHandler);
            imgTrigger.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openHandler();
              }
            });
          }

          triviaGrid.appendChild(card);
        });
      }

      /**
       * フルスクリーン画像モーダルを開く
       */
      function openFullscreenImageModal(item) {
        if (!item || !item.image) return;
        state.isImageZoomed = false;
        modalFullImage.classList.remove("is-zoomed");
        modalFullImage.src = item.image;
        modalFullImage.alt = item.title;
        modalImageTitle.textContent = item.title;
        modalImageCaption.textContent =
          item.imageCaption || "画像をタップで拡大・縮小 / 背景または「×」で閉じる";

        imageModal.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      /**
       * フルスクリーン画像モーダルを閉じる
       */
      function closeFullscreenImageModal() {
        imageModal.classList.remove("is-open");
        state.isImageZoomed = false;
        modalFullImage.classList.remove("is-zoomed");
        document.body.style.overflow = "";
      }

      /**
       * モーダル内画像の拡大・縮小トグル
       */
      function toggleModalImageZoom() {
        state.isImageZoomed = !state.isImageZoomed;
        modalFullImage.classList.toggle("is-zoomed", state.isImageZoomed);
        toggleZoomBtn.textContent = state.isImageZoomed ? "🔎 元に戻す" : "🔍 拡大切替";
      }

      /**
       * HTMLエスケープ処理
       */
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // =========================================================
      // 検索・フィルターイベント登録
      // =========================================================
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        renderTriviaList();
      });

      clearSearchBtn.addEventListener("click", () => {
        state.searchQuery = "";
        searchInput.value = "";
        searchInput.focus();
        renderTriviaList();
      });

      onlyWithImageCheckbox.addEventListener("change", (e) => {
        state.onlyWithImage = e.target.checked;
        renderTriviaList();
      });

      resetAllFiltersBtn.addEventListener("click", () => {
        state.searchQuery = "";
        state.selectedTag = "すべて";
        state.onlyWithImage = false;
        searchInput.value = "";
        onlyWithImageCheckbox.checked = false;
        renderTagPills();
        renderTriviaList();
      });

      // =========================================================
      // フルスクリーン画像モーダルのイベント登録
      // =========================================================
      closeImageModalBtn.addEventListener("click", closeFullscreenImageModal);
      toggleZoomBtn.addEventListener("click", toggleModalImageZoom);

      modalFullImage.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleModalImageZoom();
      });

      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) {
          closeFullscreenImageModal();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (imageModal.classList.contains("is-open")) {
            closeFullscreenImageModal();
          }
          if (codeExportModal.classList.contains("is-open")) {
            closeCodeExportModal();
          }
        }
      });

      // =========================================================
      // 4ファイル構成（index.html / style.css / system.js / contents.js）
      // エクスポートモーダル制御
      // =========================================================
      function getSeparatedFileContents() {
        const styleCssCode = document.getElementById("app-style-css").textContent.trim();
        const contentsJsCode = document.getElementById("app-contents-js").textContent.trim();
        const systemJsCode = document.getElementById("app-system-js").textContent.trim();

        const indexHtmlCode = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>まめちしき辞典 - ChiePedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"><\/script>
  <!-- 分離したCSSファイルの読み込み -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <!-- ヘッダー・検索バー・メイングリッド・画像モーダル本体 -->
  ${document.querySelector("header").outerHTML}
  ${document.querySelector("main").outerHTML}
  ${document.querySelector("footer").outerHTML}
  ${document.getElementById("imageModal").outerHTML}

  <!-- 分離した2つのJSファイルの読み込み -->
  <script src="contents.js"><\/script>
  <script src="system.js"><\/script>
</body>
</html>`;

        return {
          "index.html": indexHtmlCode,
          "style.css": styleCssCode,
          "system.js": systemJsCode,
          "contents.js": contentsJsCode
        };
      }

      function renderCodeTab(fileName) {
        state.activeCodeTab = fileName;
        const files = getSeparatedFileContents();
        codeViewerPre.textContent = files[fileName] || "";

        codeFileTabs.querySelectorAll(".code-tab-btn").forEach((btn) => {
          const isMatch = btn.getAttribute("data-file") === fileName;
          btn.className = isMatch
            ? "code-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white"
            : "code-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-700 hover:bg-slate-50";
        });
      }

      function closeCodeExportModal() {
        codeExportModal.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      openCodeModalBtn.addEventListener("click", () => {
        renderCodeTab(state.activeCodeTab);
        codeExportModal.classList.add("is-open");
        document.body.style.overflow = "hidden";
      });

      closeCodeModalBtn.addEventListener("click", closeCodeExportModal);

      codeExportModal.addEventListener("click", (e) => {
        if (e.target === codeExportModal) {
          closeCodeExportModal();
        }
      });

      codeFileTabs.querySelectorAll(".code-tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          renderCodeTab(btn.getAttribute("data-file"));
        });
      });

      copyCodeBtn.addEventListener("click", () => {
        const textToCopy = codeViewerPre.textContent;
        const tempTextarea = document.createElement("textarea");
        tempTextarea.value = textToCopy;
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        document.execCommand("copy");
        document.body.removeChild(tempTextarea);

        const originalLabel = copyCodeBtn.textContent;
        copyCodeBtn.textContent = "✅ コピーしました！";
        setTimeout(() => {
          copyCodeBtn.textContent = originalLabel;
        }, 1800);
      });

      // 初期描画の実行
      renderTagPills();
      renderTriviaList();
    });
  </script>
</body>
</html>
